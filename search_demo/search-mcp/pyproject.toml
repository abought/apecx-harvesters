[project]
name = "search-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0",
    "apecx-harvesters",
    "httpx>=0.28.1",
]

[project.scripts]
search-mcp = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/app.py", "src/gsearch/"]

[tool.uv]
package = true

[tool.uv.sources]
apecx-harvesters = { workspace = true }